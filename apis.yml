aid: parea
name: Parea AI
description: >-
  Parea AI is an LLM evaluation, testing, and observability platform designed
  for AI engineering teams building production-ready LLM applications. The
  platform provides a REST API for managing prompt versions, running automated
  test suites, collecting human feedback, and tracking quality metrics across
  model versions. Parea supports experiment tracking with aggregate statistics,
  trace logging for end-to-end observability, and an LLM proxy gateway that
  enables unified access to multiple model providers with built-in caching and
  retries. Native SDKs for Python and TypeScript integrate with popular
  frameworks including OpenAI, Anthropic, LangChain, Instructor, DSPy, and
  LiteLLM, making it easy to instrument existing applications.
