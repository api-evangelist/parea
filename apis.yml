apis:
  - aid: parea:parea-rest-api
    name: Parea REST API
    description: >-
      The Parea REST API enables programmatic access to the full Parea AI
      platform, including trace logging for LLM calls, experiment creation and
      management, dataset operations, LLM proxy completions, and project
      management. Authentication is performed via the x-api-key header using a
      secret key generated from the Parea settings page.
