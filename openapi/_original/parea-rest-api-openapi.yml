openapi: 3.0.3
info:
  title: Parea AI REST API
  version: 1.0.0
  description: The Parea AI REST API provides programmatic access to the Parea platform,
    including trace logging for LLM calls, experiment creation and management, dataset
    operations, LLM proxy completions, and project management. Authentication is performed
    via the x-api-key header.
  contact:
    url: https://www.parea.ai/
    email: support@parea.ai
  license:
    name: Proprietary
paths:
  /api/parea/v1/:
    get:
      summary: Health Check
      operationId: health_check_api_parea_v1__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Check Api Parea V1  Get
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
  /api/parea/v1/completion:
    post:
      summary: Completion
      description: 'Get a completion response using either one of your organizationâ€™s
        deployed prompts, or by providing completion details including prompt and
        inputs in the request.

        This endpoint acts as a LLM gateway/proxy endpoint to generate completions
        from different LLMs.'
      operationId: completion_api_parea_v1_completion_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionsSchema'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionsResponseSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
  /api/parea/v1/completion/stream:
    post:
      summary: Stream Completion
      description: 'Get a completion response using either one of your organizationâ€™s
        deployed prompts, or by providing completion details including prompt and
        inputs in the request.


        This endpoint acts as a LLM gateway/proxy endpoint to generate completions
        from different LLMs.'
      operationId: stream_completion_api_parea_v1_completion_stream_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionsSchema'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
  /api/parea/v1/deployed-prompt:
    post:
      summary: Fetch Deployed Prompt
      description: Given a deployment_id, fetches the deployed prompt and its details.
        Can be optionally used to fill-in the templated prompt with provided inputs.
      operationId: fetch_deployed_prompt_api_parea_v1_deployed_prompt_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentPromptIdSchema'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDeployedPromptResponseSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
  /api/parea/v1/feedback:
    post:
      summary: Record Feedback
      description: Record any (user) feedback & ground truth/correction of output
        for a log.
      operationId: record_feedback_api_parea_v1_feedback_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequestSchema'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
  /api/parea/v1/trace_log:
    put:
      summary: Update Trace Log
      description: Update fields of a trace log.
      operationId: update_trace_log_api_parea_v1_trace_log_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLogSchema'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
    post:
      summary: Record Trace Log
      description: Log a (LLM) span to visualize inference results, or chains.
      operationId: record_trace_log_api_parea_v1_trace_log_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TraceLogSchema'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
  /api/parea/v1/trace_log/langchain:
    post:
      summary: Record Langchain Trace Log
      operationId: record_langchain_trace_log_api_parea_v1_trace_log_langchain_post
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: Run
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
  /api/parea/v1/experiment:
    post:
      summary: Create Experiment Api
      description: Create an experiment and get the associated experiment uuid.
      operationId: create_experiment_api_api_parea_v1_experiment_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExperimentRequestSchema'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
  /api/parea/v1/experiment/{experiment_uuid}/stats:
    get:
      summary: Get Experiment Stats Api
      description: Fetches aggregated stats for every root-level trace log in an experiment.
      operationId: get_experiment_stats_api_api_parea_v1_experiment__experiment_uuid__stats_get
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
      parameters:
      - name: experiment_uuid
        in: path
        required: true
        schema:
          type: string
          title: Experiment Uuid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentStatsSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/parea/v1/experiment/{experiment_uuid}/finished:
    post:
      summary: Finish Experiment Api
      description: Finishes an experiment, calculates stats and returns all stats
        for root trace logs
      operationId: finish_experiment_api_api_parea_v1_experiment__experiment_uuid__finished_post
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
      parameters:
      - name: experiment_uuid
        in: path
        required: true
        schema:
          type: string
          title: Experiment Uuid
      requestBody:
        content:
          application/json:
            schema:
              title: Finish Experiment Request
              $ref: '#/components/schemas/FinishExperimentRequestSchema'
              nullable: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentStatsSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/parea/v1/project:
    post:
      summary: Create Or Get Project Api
      description: Create a project or get the project if it already exists. Is used
        to find out UUID of project.
      operationId: create_or_get_project_api_api_parea_v1_project_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGetProjectRequestSchema'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGetProjectResponseSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
  /api/parea/v1/collection/{test_collection_identifier}:
    get:
      summary: Get Test Case Collection By Identifier
      description: "Fetches dataset/test case collection by its ID or name.\n\nArgs:\n\
        \    test_collection_identifier (Union[str, int]): ID or name of the test\
        \ case collection/dataset."
      operationId: get_test_case_collection_by_identifier_api_parea_v1_collection__test_collection_identifier__get
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
      parameters:
      - name: test_collection_identifier
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: integer
          title: Test Collection Identifier
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Get Test Case Collection By Identifier Api Parea V1
                  Collection  Test Collection Identifier  Get
                $ref: '#/components/schemas/GetTestCaseCollectionResponseSchema'
                nullable: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/parea/v1/collection:
    post:
      summary: Create Collection
      description: Creates a dataset
      operationId: create_collection_api_parea_v1_collection_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTestCaseCollectionRequestSchema'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTestCaseCollectionResponseSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
  /api/parea/v1/testcases:
    post:
      summary: Create Test Cases For Dataset
      description: "Adds items/test cases to a dataset. If the dataset does not exist,\
        \ it will be created.\nReturns the IDs of the created items/test cases.\n\n\
        Returns:\n    List[int]: List of IDs of the created items/test cases."
      operationId: create_test_cases_for_dataset_api_parea_v1_testcases_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTestCasesSchema'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: integer
                type: array
                title: Response Create Test Cases For Dataset Api Parea V1 Testcases
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
  /api/parea/v1/trace_log/{trace_id}:
    get:
      summary: Get Trace Log Api
      description: Fetches a trace log by its UUID.
      operationId: get_trace_log_api_api_parea_v1_trace_log__trace_id__get
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
          title: Trace Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Get Trace Log Api Api Parea V1 Trace Log  Trace Id  Get
                $ref: '#/components/schemas/TraceLogTreeSchema'
                nullable: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/parea/v1/experiments:
    post:
      summary: List Experiments Api
      description: Lists experiments given a set of filters incl. their high-level
        statistics.
      operationId: list_experiments_api_api_parea_v1_experiments_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListExperimentsRequestSchema'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ExperimentWithStatsSchema'
                type: array
                title: Response List Experiments Api Api Parea V1 Experiments Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
  /api/parea/v1/experiment/{experiment_uuid}/trace_logs:
    post:
      summary: Get Experiment Trace Logs Api
      description: "Fetches all trace logs for an experiment.\n\nArgs:\n    experiment_uuid\
        \ (str): UUID of the experiment.\n\nReturns:\n    list[TraceLogTreeSchema]:\
        \ List of trace logs for the experiment."
      operationId: get_experiment_trace_logs_api_api_parea_v1_experiment__experiment_uuid__trace_logs_post
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
      parameters:
      - name: experiment_uuid
        in: path
        required: true
        schema:
          type: string
          title: Experiment Uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterBaseSchema'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TraceLogTreeSchema'
                title: Response Get Experiment Trace Logs Api Api Parea V1 Experiment  Experiment
                  Uuid  Trace Logs Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/parea/v1/get_trace_logs:
    post:
      summary: Get Trace Logs Api
      description: Fetches trace logs and returns them as a paginated response.
      operationId: get_trace_logs_api_api_parea_v1_get_trace_logs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryParamsPaginationPublic'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_TraceLogTreeSchema_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
  /api/parea/v1/update_test_case/{dataset_id}/{test_case_id}:
    post:
      summary: Update Test Case
      description: "Update the item/test case of the dataset with any given fields.\n\
        \nArgs:\n    dataset_id (int): ID of the dataset.\n    test_case_id (int):\
        \ ID of the item/test case.\n    update_test_case_request (UpdateTestCasePublicRequestSchema):\
        \ Request body containing the fields to update."
      operationId: update_test_case_api_parea_v1_update_test_case__dataset_id___test_case_id__post
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
      - APIKeyHeader: []
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: integer
          title: Dataset Id
      - name: test_case_id
        in: path
        required: true
        schema:
          type: integer
          title: Test Case Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTestCasePublicRequestSchema'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AddColumnsSchema:
      properties:
        columns:
          items:
            $ref: '#/components/schemas/NewColumn'
          type: array
          title: Columns
        backfill:
          type: boolean
          title: Backfill
          default: true
      type: object
      required:
      - columns
      title: AddColumnsSchema
    AddExperimentTraceLogsToAnnotationQueuesSchema:
      properties:
        experiment_uuid:
          type: string
          title: Experiment Uuid
        annotation_queue_uuids:
          items:
            type: string
          type: array
          title: Annotation Queue Uuids
      type: object
      required:
      - experiment_uuid
      - annotation_queue_uuids
      title: AddExperimentTraceLogsToAnnotationQueuesSchema
    AddTraceLogsToAnnotationQueuesSchema:
      properties:
        trace_ids:
          items:
            type: string
          type: array
          title: Trace Ids
        annotation_queue_uuids:
          items:
            type: string
          type: array
          title: Annotation Queue Uuids
      type: object
      required:
      - trace_ids
      - annotation_queue_uuids
      title: AddTraceLogsToAnnotationQueuesSchema
    AnalyticsRequestSchema:
      properties:
        name:
          type: string
          title: Name
        data:
          title: Data
          type: object
          nullable: true
      type: object
      required:
      - name
      title: AnalyticsRequestSchema
    AnnotationCriterionSchema:
      properties:
        name:
          type: string
          title: Name
          description: Annotation name
        type:
          allOf:
          - $ref: '#/components/schemas/DefinedAnnotationType'
          description: Annotation type
        min_value:
          title: Min Value
          description: Minimum value
          type: number
          nullable: true
        max_value:
          title: Max Value
          description: Maximum value
          type: number
          nullable: true
        value_score_map:
          title: Value Score Map
          description: Value to score mapping
          additionalProperties:
            type: number
          type: object
          nullable: true
        id:
          anyOf:
          - type: string
          - type: integer
          title: Id
          description: Annotation ID
        organization_id:
          type: string
          title: Organization Id
          description: Organization ID
        description:
          title: Description
          description: Annotation description
          type: string
          nullable: true
        cur_bootstrapped_eval_id:
          title: Cur Bootstrapped Eval Id
          description: Current bootstrapped evaluation ID
          type: integer
          nullable: true
        bootstrapped_evals:
          additionalProperties:
            $ref: '#/components/schemas/BootstrapEvalSchema'
          type: object
          title: Bootstrapped Evals
          description: Bootstrapped evaluations
      type: object
      required:
      - name
      - type
      - id
      - organization_id
      title: AnnotationCriterionSchema
    AnnotationQueueItemSchema:
      properties:
        annotation_queue_item_uuid:
          type: string
          title: Annotation Queue Item Uuid
        trace_id:
          type: string
          title: Trace Id
      type: object
      required:
      - annotation_queue_item_uuid
      - trace_id
      title: AnnotationQueueItemSchema
    AnnotationQueueSchema:
      properties:
        name:
          type: string
          title: Name
          description: Annotation name
        uuid:
          type: string
          title: Uuid
          description: Annotation ID
        created_at:
          type: string
          title: Created At
          description: Annotation creation time
        updated_at:
          type: string
          title: Updated At
          description: Annotation last update time
        organization_id:
          type: string
          title: Organization Id
          description: Organization ID
      type: object
      required:
      - name
      - uuid
      - created_at
      - updated_at
      - organization_id
      title: AnnotationQueueSchema
    Body_save_image_api_lab_save_image_post:
      properties:
        image:
          type: string
          format: binary
          title: Image
      type: object
      required:
      - image
      title: Body_save_image_api_lab_save_image_post
    BootstrapEvalFullResultSchema:
      properties:
        stats:
          additionalProperties:
            type: number
          type: object
          title: Stats
          description: Bootstrapped eval stats
        experiment_uuid:
          type: string
          title: Experiment Uuid
          description: Experiment UUID
        source_code:
          title: Source Code
          description: Bootstrapped eval source code
          type: string
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/BootstrappedEvalStatus'
          description: Bootstrapped eval status
        output_target_pairs:
          items:
            $ref: '#/components/schemas/OutputTargetPairSchema'
          type: array
          title: Output Target Pairs
          description: Output target pairs
          default: []
      type: object
      title: BootstrapEvalFullResultSchema
    BootstrapEvalRequestSchema:
      properties:
        criterion_id:
          type: integer
          title: Criterion Id
      type: object
      required:
      - criterion_id
      title: BootstrapEvalRequestSchema
    BootstrapEvalSchema:
      properties:
        stats:
          additionalProperties:
            type: number
          type: object
          title: Stats
          description: Bootstrapped eval stats
        experiment_uuid:
          type: string
          title: Experiment Uuid
          description: Experiment UUID
        source_code:
          title: Source Code
          description: Bootstrapped eval source code
          type: string
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/BootstrappedEvalStatus'
          description: Bootstrapped eval status
      type: object
      title: BootstrapEvalSchema
    BootstrappedEvalStatus:
      type: string
      enum:
      - pending
      - running
      - completed
      - failed
      title: BootstrappedEvalStatus
    BulkDeleteExperimentsSchema:
      properties:
        experiment_uuids:
          items:
            type: string
          type: array
          title: Experiment Uuids
      type: object
      required:
      - experiment_uuids
      title: BulkDeleteExperimentsSchema
    BuyCreditsRequestSchema:
      properties:
        plan:
          type: string
          title: Plan
        interval:
          type: string
          title: Interval
          default: month
        organization_id:
          title: Organization Id
          type: string
          nullable: true
      type: object
      required:
      - plan
      title: BuyCreditsRequestSchema
    CUDAnnotationRequestSchema:
      properties:
        trace_id:
          type: string
          title: Trace Id
          description: UUID of associated trace
        defined_annotation_id:
          type: integer
          title: Defined Annotation Id
          description: Annotation criterion ID
        score:
          title: Score
          description: Annotation score
          type: number
          nullable: true
        value:
          title: Value
          description: Annotation value
          type: string
          nullable: true
      type: object
      required:
      - trace_id
      - defined_annotation_id
      title: CUDAnnotationRequestSchema
    CollectFeedbackRequestSchema:
      properties:
        result_id:
          type: integer
          title: Result Id
        feedback:
          $ref: '#/components/schemas/Rating'
      type: object
      required:
      - result_id
      - feedback
      title: CollectFeedbackRequestSchema
    CompareExperimentsRequest:
      properties:
        project_name:
          type: string
          title: Project Name
        experiment_run_names:
          items:
            type: string
          type: array
          title: Experiment Run Names
      type: object
      required:
      - project_name
      - experiment_run_names
      title: CompareExperimentsRequest
    ComparedExperimentAnnotationSchema:
      properties:
        trace_id:
          type: string
          title: Trace Id
          description: UUID of associated trace
        defined_annotation_id:
