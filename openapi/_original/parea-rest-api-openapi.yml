        latency:
          type: number
          title: Latency
          description: Latency of the completion in seconds.
        input_tokens:
          type: integer
          title: Input Tokens
          description: Number of tokens in the input.
        output_tokens:
          type: integer
          title: Output Tokens
          description: Number of tokens in the output.
        total_tokens:
          type: integer
          title: Total Tokens
          description: Total number of tokens in the input and output.
        cost:
          type: number
          title: Cost
          description: Cost of the completion in USD.
        model:
          type: string
          title: Model
          description: Model name.
        provider:
          type: string
          title: Provider
          description: Provider name.
        cache_hit:
          type: boolean
          title: Cache Hit
          description: If true, the completion was fetched from the cache.
        status:
          type: string
          title: Status
          description: Status of the completion. Either 'success' or 'error'.
        error:
          title: Error
          description: Error message if the completion failed.
          type: string
          nullable: true
        trace_id:
          title: Trace Id
          description: UUID of the log of the completion. Will be the same as the
            `trace_id` in the request if provided.
          type: string
          nullable: true
        start_timestamp:
          type: string
          title: Start Timestamp
          description: Start timestamp of the completion.
        end_timestamp:
          type: string
          title: End Timestamp
          description: End timestamp of the completion.
        inference_id:
          type: string
          title: Inference Id
          description: UUID of the log of the completion. The same as the `trace_id`
            in the request if provided.
      type: object
      required:
      - content
      - latency
      - input_tokens
      - output_tokens
      - total_tokens
      - cost
      - model
      - provider
      - cache_hit
      - status
      - start_timestamp
      - end_timestamp
      - inference_id
      title: CompletionsResponseSchema
      example:
        cache_hit: true
        content: Sure! Here's a simple Hello World program...
        cost: 0.0008
        end_timestamp: '2024-07-24 18:05:17'
        input_tokens: 22
        latency: 0.0
        model: gpt-4o-mini-2024-07-18
        output_tokens: 189
        start_timestamp: '2024-07-24 18:05:17'
        status: success
        total_tokens: 211
        trace_id: ush221-d23rfcasc-21cdsc
    CompletionsSchema:
      properties:
        llm_inputs:
          title: Llm Inputs
          description: Key-value pairs as inputs to prompt template. Only needs to
            be provided if `deployment_id` is provided or `llm_configuration.messages`
            are templated.
          type: object
          nullable: true
        llm_configuration:
          allOf:
          - $ref: '#/components/schemas/LLMInputsSchema'
          description: LLM configuration parameters such as messages, functions, etc.
          default: {}
        project_name:
          title: Project Name
          description: Project name which is used to associate the log with a project.
          default: default
          type: string
          nullable: true
        project_uuid:
          title: Project Uuid
          description: Project UUID which is used to associate the log with a project.
            Does not need to be provided if the `project_name` is provided.
          type: string
          nullable: true
        experiment_uuid:
          title: Experiment Uuid
          description: Experiment UUID which is used to associate the log with an
            experiment.
          type: string
          nullable: true
        parent_trace_id:
          title: Parent Trace Id
          description: UUID of the parent log. If given, will be used to associate
            the generation in a chain & create hierarchical nested logs.
          type: string
          nullable: true
        root_trace_id:
          title: Root Trace Id
          description: UUID of the root log. If given, will be used to associate the
            generation in a chain & create hierarchical nested logs.
          type: string
          nullable: true
        end_user_identifier:
          title: End User Identifier
          description: Special field to track the end user which is interacting with
            your LLM app.
          type: string
          nullable: true
        deployment_id:
          title: Deployment Id
          description: This is the ID for a specific deployed prompt. You can find
            your deployed prompts on the Deployments tab. If a deployment_id is provided,
            Parea will fetch all of the associated configuration including model name,
            model parameters, and any associated functions. Any information provided
            on the llm_configuration field will be used instead of the associated
            deployed prompts fields.
          type: string
          nullable: true
        eval_metric_ids:
          title: Eval Metric Ids
          description: List of evaluation metric IDs deployed on Parea which should
            be used to evaluate the completion output.
          items:
            type: integer
          type: array
          nullable: true
        metadata:
          title: Metadata
          description: Key-value pairs to be associated with the log.
          type: object
          nullable: true
        tags:
          title: Tags
          description: List of tags to be associated with the log.
          items:
            type: string
          type: array
          nullable: true
        target:
          title: Target
          description: Optional ground truth output for the inputs. Will be used for
            evaluation and can be used when creating a test case from the log.
          type: string
          nullable: true
        trace_id:
          title: Trace Id
          description: UUID of the generation log. If not given, will be auto-generated.
          type: string
          nullable: true
        trace_name:
          title: Trace Name
          description: Name of the generation log. If not given, will be auto-generated
            in the format `llm-{provider}`.
          type: string
          nullable: true
        provider_api_key:
          title: Provider Api Key
          description: Provider API key to generate response. If not given, API keys
            saved on the platform will be used
          type: string
          nullable: true
        cache:
          type: boolean
          title: Cache
          description: If true, the completion will be cached to avoid latency & cost
            for any subsequent completion using the same inputs.
          default: true
        log_omit_inputs:
          type: boolean
          title: Log Omit Inputs
          description: If true, the inputs, llm_configuration.messages, llm_configuration.functions,
            llm_configuration.model_params will not be logged.
          default: false
        log_omit_outputs:
          type: boolean
          title: Log Omit Outputs
          description: If true, the generated response will not be logged.
          default: false
        log_omit:
          type: boolean
          title: Log Omit
          description: Equivalent to setting both log_omit_inputs and log_omit_outputs
            to true.
          default: false
        log_sample_rate:
          title: Log Sample Rate
          description: If specified, this log and its entire associated trace will
            logged with this probability. Must be between 0 and 1 (incl.). Defaults
            to 1.0 (i.e., keeping all logs)
          default: 1.0
          type: number
          maximum: 1.0
          minimum: 0.0
          nullable: true
        inference_id:
          title: Inference Id
          description: Deprecated field which is the same `trace_id`
          type: string
          nullable: true
        name:
          title: Name
          description: Deprecated field
          type: string
          nullable: true
        retry:
          type: boolean
          title: Retry
          description: Deprecated field
          default: false
        fallback_strategy:
          title: Fallback Strategy
          description: Deprecated field
          items:
            type: string
          type: array
          nullable: true
        stream:
          type: boolean
          title: Stream
          description: Deprecated field. Use /completion/stream instead.
          default: false
      type: object
      title: CompletionsSchema
      examples:
      - end_user_identifier: 2596@gmail.com
        inputs:
          city: New York
        llm_configuration:
          function_call: auto
          functions:
          - description: Get the current weather in a given location.
            name: get_current_weather
            parameters:
              properties:
                location:
                  description: The city and state, e.g. San Francisco, CA
                  type: string
                unit:
                  enum:
                  - celsius
                  - fahrenheit
                  type: string
              required:
              - location
              type: object
          messages:
          - content: What is the weather in New York
            role: user
          model: gpt-4o-mini
          model_params:
            max_length: 500
            model: gpt-4o-mini
            temp: 0.0
          provider: openai
        metadata:
          purpose: testing
          user_id: user_2Q9afRAKe6SZrc3U7
        tags:
        - weather
        - forecast
      - deployment_id: p-qZrnFesaeCpqcXJ_yL3wi
        llm_inputs:
          x: Golang
          y: Fiber
        metadata:
          purpose: testing
